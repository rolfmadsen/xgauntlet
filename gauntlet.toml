# xgauntlet configuration for rust
stack = "rust"
save_evidence = true
evidence_file = "verification-report.json"
evidence_markdown_file = "evidence.md"

[paths]
tasks_dir = "tasks"
spec_file = "spec.md"
context_file = "CONTEXT.md"
coding_standards_file = "CODING_STANDARDS.md"
diagram_file = "architecture.mermaid"

[architecture]
max_file_lines = 800
max_test_file_lines = 1000
forbidden_tokens = ["Color::from_rgb", "Color::from_rgba"]
layers = ["app", "features", "core", "shared"]
slice_root = "crates/xgauntlet-core/src/features"
isolate_slices = true

[[architecture.exemptions]]
path = "crates/xgauntlet-core/src/features/**"
reason = "Shared kernel & foundational core feature slices in xgauntlet-core jf. ADR 0001 and ADR 0012"
adr = "docs/adr/0012-vertical-slice-boundaries-and-adr-lifecycle.md"
allow_imports = ["crate::features::adapters", "crate::features::checkpoint", "crate::features::config", "crate::features::diagnostics", "crate::features::evidence", "crate::features::gauntlet", "crate::features::plugin", "crate::features::policy", "crate::features::scaffold", "crate::features::tasks", "crate::features::topology", "crate::features::wasm"]

[[architecture.exemptions]]
path = "crates/xgauntlet-cli/src/main.rs"
reason = "CLI root dispatcher containing multi-subcommand handlers; ratchet limit jf. ADR 0010"
adr = "docs/adr/0010-adr-bound-architectural-exemptions-and-monotonic-ratchets.md"
max_lines = 2180

[[architecture.exemptions]]
path = "crates/xgauntlet-core/tests/harness_contracts_test.rs"
reason = "Multi-adapter subprocess contract tests; ratchet limit jf. ADR 0004"
adr = "docs/adr/0004-harness-adapter-slices.md"
max_lines = 1600

[[architecture.exemptions]]
path = "crates/xgauntlet-core/tests/harness_adapters_test.rs"
reason = "Multi-adapter payload roundtrip and conformance suite; ratchet limit jf. ADR 0004"
adr = "docs/adr/0004-harness-adapter-slices.md"
max_lines = 1700

[[layers]]
name = "architecture"
command = ["cargo", "run", "-p", "xgauntlet-cli", "--", "check-architecture"]
optional = false
timeout_seconds = 60.0

[[layers]]
name = "format"
command = ["cargo", "fmt", "--check"]
optional = false
timeout_seconds = 30.0

[[layers]]
name = "lint"
command = ["cargo", "clippy", "--all-targets", "--", "-D", "warnings"]
optional = false
timeout_seconds = 60.0

[[layers]]
name = "unit"
command = ["cargo", "test", "--workspace"]
optional = false
timeout_seconds = 120.0

[[layers]]
name = "npm"
command = ["npm", "test", "--workspaces"]
optional = false
timeout_seconds = 60.0

[[layers]]
name = "invariants"
command = ["cargo", "run", "-p", "xgauntlet-cli", "--", "check-spec", "--context"]
optional = false
timeout_seconds = 60.0

[[layers]]
name = "mutation-testing-gauntlet"
command = ["cargo", "mutants"]
optional = true
timeout_seconds = 180.0
