name: Release & Distribution Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    name: Run Full CI Gauntlet
    uses: ./.github/workflows/ci.yml

  gate-check-release:
    name: Gatekeeper Check Release
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Tag Matches Manifest Version
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::Release tag version ($TAG_VER) does not match package.json version ($PKG_VER)"
            exit 1
          fi

      - name: Build CLI Engine
        run: cargo build -p xgauntlet-cli

      - name: Verify WASM Bytecode Intact
        run: |
          if [ ! -f "crates/xgauntlet-core/wasm/gauntlet_policy.wasm" ]; then
            echo "::error::WASM bytecode artifact missing at crates/xgauntlet-core/wasm/gauntlet_policy.wasm"
            exit 1
          fi
          HEADER=$(head -c 4 crates/xgauntlet-core/wasm/gauntlet_policy.wasm | od -An -tx1 | tr -d ' \n')
          if [ "$HEADER" != "0061736d" ]; then
            echo "::error::WASM bytecode header invalid: $HEADER"
            exit 1
          fi

      - name: Run Strict Release Gatekeeper
        run: cargo run -p xgauntlet-cli -- check-release --strict

  build-binaries:
    name: Build Native Engine (${{ matrix.target }})
    needs: gate-check-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: xgauntlet-linux-x64.tar.gz
            archive_cmd: tar -czvf xgauntlet-linux-x64.tar.gz -C target/x86_64-unknown-linux-gnu/release xgauntlet

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: xgauntlet-linux-arm64.tar.gz
            archive_cmd: tar -czvf xgauntlet-linux-arm64.tar.gz -C target/aarch64-unknown-linux-gnu/release xgauntlet

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: xgauntlet-darwin-arm64.tar.gz
            archive_cmd: tar -czvf xgauntlet-darwin-arm64.tar.gz -C target/aarch64-apple-darwin/release xgauntlet

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: xgauntlet-darwin-x64.tar.gz
            archive_cmd: tar -czvf xgauntlet-darwin-x64.tar.gz -C target/x86_64-apple-darwin/release xgauntlet

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: xgauntlet-win32-x64.zip
            archive_cmd: powershell -Command "Compress-Archive -Path target/x86_64-pc-windows-msvc/release/xgauntlet.exe -DestinationPath xgauntlet-win32-x64.zip"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build native release binary
        run: cargo build --release --target ${{ matrix.target }} -p xgauntlet-cli

      - name: Archive binary
        run: ${{ matrix.archive_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 2

  attest-binaries:
    name: Attest Multi-Subject Release Archives
    needs: [gate-check-release, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: read

    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: dist-binaries
          merge-multiple: true

      - name: Attest Multi-Subject Archives via Sigstore
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist-binaries/*'

      - name: Upload Attestation Bundle Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: attestation.bundle
          path: ${{ steps.attest.outputs.bundle-path }}
          retention-days: 2

  create-github-release:
    name: Publish GitHub Release & Assets
    needs: [gate-check-release, build-binaries, attest-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all binary artifacts and attestation
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: dist-release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true

  publish-npm:
    name: Publish NPM Package (xgauntlet)
    needs: [gate-check-release, create-github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI for local verification
        run: cargo build -p xgauntlet-cli

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Run verification checks
        run: npm test --workspaces

      - name: Publish to NPM Registry
        working-directory: ./packages/cli
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version > /dev/null 2>&1; then
            echo "::warning::Package ${PKG_NAME}@${PKG_VER} is already published on npm registry. Skipping publish to avoid E403 conflict."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
