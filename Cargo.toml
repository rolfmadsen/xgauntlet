[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
version = "0.16.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/rolfmadsen/xgauntlet"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.43", features = ["full"] }
sha2 = "0.10"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
wasmtime = { version = "50.0.2", default-features = false, features = ["cranelift", "runtime", "std"] }
gauntlet-policy-engine = { path = "crates/gauntlet-policy-engine" }
