[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Antigravity Team"]
license = "MIT"
repository = "https://github.com/rolfmadsen/xgauntlet"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
wasmtime = { version = "30.0.0", default-features = false, features = ["cranelift", "runtime", "std"] }
gauntlet-policy-engine = { path = "crates/gauntlet-policy-engine" }
